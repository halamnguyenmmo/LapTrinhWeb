<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
 </head>
<body>
    <form action="#" method="post">
        <fieldset>
            <legend>Thông tin Cá Nhân</legend>
            <label for="name">Họ và tên:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="message">Tin nhắn:</label><br>
            <textarea id="message" name="message" rows="4" cols="50" required></textarea><br><br>

            <input type="submit" value="Gửi">
        </fieldset>
        <fieldset>
            <legend>Nội dung</legend>
            <label for="subject">Chủ đề:</label>
            <select id="subject" name="subject" >
                <option value="">-- Chọn --</option>
                <option value="support">Hỗ trợ</option>
            </select>
        </fieldset>
        <fieldset>
            <label for="msg" Tin Nhắn:</label>
            <textarea id="msg" name="msg" rows="5" required></textarea>
        </fieldset>
        <fieldset>
            <button type="submit">Gửi</button>
        </fieldset>
    </form>
    <h2 class="nguyen"> validation</h2>
    <input type="text" name="email" required>
    <input type="text" name="Phone" pattern="[0-9]{10,11}" title="Nhập 10 - 11 Chữ số "> 
    <input type="text" name="username" minlength="3" maxlength="20" required>
    <select name="province" >
        <option value="">-- Chọn Tỉnh/Thành phố --</option>
        <option value="hcm" selected>Hồ Chí Minh</option>
        <option value="hn">Hà Nội</option>
    </select>
    <button type="submit">Gửi</button>
    <input type="reset" value="Reset">
</form>
</body>
</html>
